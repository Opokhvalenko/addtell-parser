name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The secret scan needs the commits between the base and this head
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # The new commits of this PR or push. Runs as the runner's user: as root, git in the
      # container refuses the checkout ("dubious ownership") and silently scans 0 commits.
      - name: Secret scan (gitleaks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then RANGE="HEAD"; else RANGE="$BASE_SHA..HEAD"; fi
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --no-banner --redact --log-opts="$RANGE"

      - name: Dependency vulnerabilities (production deps, critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Biome check
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      # Local, throwaway database: tests/setup.ts refuses anything that is not localhost
      NODE_ENV: test
      DATABASE_URL: "mongodb://localhost:27017/adtell_test?replicaSet=rs0&directConnection=true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Prisma needs a replica set on MongoDB (service containers cannot pass --replSet)
      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break
            sleep 1
          done

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Tests
        run: npm test

      - name: TypeScript build
        run: npm run build
